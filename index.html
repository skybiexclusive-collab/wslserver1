<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Linux Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Üst Sekme Çubuğu */
    #topbar {
      height: 38px;
      background: #1b1b1b;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid #2d2d2d;
      user-select: none;
    }
    .brand {
      color: #48d597;
      font-size: 13px;
      font-weight: bold;
      margin-right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tabs {
      display: flex;
      flex: 1;
      overflow-x: auto;
      height: 100%;
      align-items: flex-end;
      gap: 3px;
    }
    .tab {
      background: #242424;
      color: #999;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      transition: background 0.15s ease;
    }
    .tab:hover {
      background: #2c2c2c;
      color: #eee;
    }
    .tab.active {
      background: #121212;
      color: #fff;
      font-weight: 600;
      border-color: #2d2d2d;
    }
    .tab .close-btn {
      color: #888;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .tab .close-btn:hover {
      background: #3d3d3d;
      color: #ff5555;
    }
    #add-btn {
      background: #252525;
      color: #eee;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      margin-left: 8px;
    }
    #add-btn:hover {
      background: #353535;
    }
    /* Tam Ekran Terminal Alanı */
    #terminals {
      flex: 1;
      width: 100%;
      position: relative;
      background: #121212;
    }
    .term-box {
      position: absolute;
      inset: 0;
      padding: 6px;
      display: none;
    }
    .term-box.active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="brand">🐧 Cloud Terminal</div>
    <div class="tabs" id="tab-list"></div>
    <button id="add-btn" title="Yeni Terminal Oturumu Aç">+ Yeni Oturum</button>
  </div>

  <div id="terminals"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    let sessionCounter = 0;
    let activeSessionId = null;
    const sessions = {};

    const tabList = document.getElementById("tab-list");
    const terminalsContainer = document.getElementById("terminals");
    const addBtn = document.getElementById("add-btn");

    function createSession() {
      sessionCounter++;
      const id = "session-" + sessionCounter;
      const name = "Bash #" + sessionCounter;

      // Sekme Butonu
      const tab = document.createElement("div");
      tab.className = "tab";
      tab.id = "tab-" + id;
      tab.innerHTML = `<span>${name}</span><span class="close-btn">&times;</span>`;
      tab.onclick = () => switchSession(id);
      tab.querySelector(".close-btn").onclick = (e) => {
        e.stopPropagation();
        closeSession(id);
      };
      tabList.appendChild(tab);

      // Terminal Taşıyıcı
      const box = document.createElement("div");
      box.className = "term-box";
      box.id = "box-" + id;
      terminalsContainer.appendChild(box);

      // xterm.js Kurulumu
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Consolas, "Courier New", monospace',
        theme: {
          background: "#121212",
          foreground: "#e0e0e0"
        }
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(box);

      // WebSocket Bağlantısı (HTTPS ise wss://, HTTP ise ws://)
      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      const ws = new WebSocket(`${protocol}${location.host}`);

      ws.onmessage = (event) => term.write(event.data);
      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(data);
        }
      });

      sessions[id] = { term, fitAddon, ws, tab, box };
      switchSession(id);
    }

    function switchSession(id) {
      if (!sessions[id]) return;
      activeSessionId = id;

      Object.keys(sessions).forEach((sid) => {
        sessions[sid].tab.classList.toggle("active", sid === id);
        sessions[sid].box.classList.toggle("active", sid === id);
      });

      setTimeout(() => {
        sessions[id].fitAddon.fit();
        sessions[id].term.focus();
      }, 20);
    }

    function closeSession(id) {
      if (!sessions[id]) return;

      sessions[id].ws.close();
      sessions[id].term.dispose();
      sessions[id].tab.remove();
      sessions[id].box.remove();
      delete sessions[id];

      const remaining = Object.keys(sessions);
      if (remaining.length > 0) {
        if (activeSessionId === id) {
          switchSession(remaining[remaining.length - 1]);
        }
      } else {
        createSession();
      }
    }

    addBtn.onclick = () => createSession();

    window.addEventListener("resize", () => {
      if (activeSessionId && sessions[activeSessionId]) {
        sessions[activeSessionId].fitAddon.fit();
      }
    });

    // Açılışta ilk oturumu başlat
    createSession();
  </script>
</body>
</html>
    // İlk oturumu otomatik başlat
    createSession();
  </script>
</body>
</html>
