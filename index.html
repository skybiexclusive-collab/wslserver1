<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>WinWSL Çoklu Oturum</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #181818;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #topbar {
      background: #1f1f1f;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #333;
      padding: 0 10px;
    }
    .brand {
      color: #e95420; /* Ubuntu Turuncusu */
      font-weight: bold;
      font-size: 13px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tabs {
      display: flex;
      flex: 1;
      overflow-x: auto;
      gap: 4px;
      padding-top: 6px;
    }
    .tab {
      background: #2b2b2b;
      color: #999;
      padding: 6px 14px;
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      border: 1px solid transparent;
      border-bottom: none;
    }
    .tab.active {
      background: #181818;
      color: #fff;
      font-weight: bold;
      border-color: #333;
    }
    .tab .close-btn {
      color: #777;
      font-weight: bold;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .tab .close-btn:hover {
      background: #444;
      color: #ff5555;
    }
    #add-session-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      margin-left: 8px;
    }
    #add-session-btn:hover { background: #3a3a3a; }
    #terminals {
      flex: 1;
      position: relative;
      background: #181818;
    }
    .term-box {
      position: absolute;
      inset: 0;
      padding: 8px;
      display: none;
    }
    .term-box.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="brand">🐧 WinWSL</div>
    <div class="tabs" id="tab-list"></div>
    <button id="add-session-btn" title="Yeni Ubuntu Oturumu Başlat">+ Yeni Oturum</button>
  </div>
  <div id="terminals"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    let sessionCounter = 0;
    let activeSessionId = null;
    const sessions = {};

    const tabList = document.getElementById('tab-list');
    const terminalsContainer = document.getElementById('terminals');
    const addBtn = document.getElementById('add-session-btn');

    function createSession() {
      sessionCounter++;
      const id = 'session-' + sessionCounter;
      const sessionName = 'Ubuntu #' + sessionCounter;

      // Tab Elementi
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.id = 'tab-' + id;
      tab.innerHTML = `<span>${sessionName}</span><span class="close-btn">&times;</span>`;
      tab.onclick = () => switchSession(id);
      tab.querySelector('.close-btn').onclick = (e) => {
        e.stopPropagation();
        closeSession(id);
      };
      tabList.appendChild(tab);

      // Terminal Container
      const box = document.createElement('div');
      box.className = 'term-box';
      box.id = 'box-' + id;
      terminalsContainer.appendChild(box);

      // xterm.js Nesnesi
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'Consolas, "Courier New", monospace',
        theme: { background: '#181818', foreground: '#dddddd' }
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(box);

      // WebSocket Bağlantısı
      const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const ws = new WebSocket(`${protocol}${location.host}`);

      ws.onmessage = (event) => term.write(event.data);
      term.onData((data) => ws.send(data));

      sessions[id] = { term, fitAddon, ws, tab, box };

      switchSession(id);
    }

    function switchSession(id) {
      if (!sessions[id]) return;
      activeSessionId = id;

      Object.keys(sessions).forEach((sid) => {
        sessions[sid].tab.classList.toggle('active', sid === id);
        sessions[sid].box.classList.toggle('active', sid === id);
      });

      setTimeout(() => {
        sessions[id].fitAddon.fit();
        sessions[id].term.focus();
      }, 10);
    }

    function closeSession(id) {
      if (!sessions[id]) return;

      sessions[id].ws.close();
      sessions[id].term.dispose();
      sessions[id].tab.remove();
      sessions[id].box.remove();
      delete sessions[id];

      const remainingIds = Object.keys(sessions);
      if (remainingIds.length > 0) {
        if (activeSessionId === id) {
          switchSession(remainingIds[remainingIds.length - 1]);
        }
      } else {
        createSession();
      }
    }

    addBtn.onclick = () => createSession();

    window.addEventListener('resize', () => {
      if (activeSessionId && sessions[activeSessionId]) {
        sessions[activeSessionId].fitAddon.fit();
      }
    });

    // İlk oturumu otomatik başlat
    createSession();
  </script>
</body>
</html>
